<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator</title>
</head>
<body>

    <h1>Kalkulator Sederhana</h1>
    
    <p>Masukkan angka (gunakan koma untuk banyak angka, misal: 10, 5, 2):</p>
    <input type="text" id="inputAngka" placeholder="Contoh: 10, 5, 2">

    <p>Pilih Operasi:</p>
    <select id="pilihOperator">
        <option value="+">Tambah (+)</option>
        <option value="-">Kurang (-)</option>
        <option value="*">Kali (*)</option>
        <option value="/">Bagi (/)</option>
        <option value="%">Sisa Bagi (%)</option>
    </select>

    <br><br>
    <button id="tombolHitung">Hitung Sekarang</button>

    <hr>
    <h3>Hasil:</h3>
    <div id="areaHasil"></div>

    <script src="kalkulator.js"></script>
</body>
</html>
